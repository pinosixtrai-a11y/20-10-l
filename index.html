<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Gửi Linh</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root {
  --ink: #1a0a14;
  --petal: #e8547a;
  --blossom: #f2a0b8;
  --cream: #fff6f0;
  --gold: #e8c06a;
  --mist: rgba(232,84,122,0.08);
  --serif: 'Cormorant Garamond', 'Times New Roman', Georgia, serif;
  --sans: 'Quicksand', 'Segoe UI', sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:#0e0610;
  color:var(--cream);
  font-family:var(--sans);
}

/* ── canvas bầu trời ── */
#sky{position:fixed;inset:0;z-index:0;overflow:hidden}
.nebula{
  position:absolute;border-radius:50%;
  filter:blur(90px);opacity:.22;pointer-events:none;
}
.n1{width:70vw;height:70vw;background:radial-gradient(circle,#7a1a40,transparent 70%);left:-20%;top:-20%}
.n2{width:60vw;height:60vw;background:radial-gradient(circle,#2a0a4e,transparent 70%);right:-15%;bottom:-15%}
.n3{width:40vw;height:40vw;background:radial-gradient(circle,#601430,transparent 70%);right:20%;top:15%}

/* ── sao nhỏ ── */
.star{
  position:absolute;border-radius:50%;background:#fff;
  animation:twinkle var(--d) ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.05}to{opacity:.85;box-shadow:0 0 6px #fff}}

/* ── STAGE ── */
#stage{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:.8rem;
  transition:opacity 1.2s,transform 1.2s;
}
#stage.hide{opacity:0;transform:scale(.94) translateY(-20px);pointer-events:none}

/* chữ bay title */
.line{
  display:flex;flex-wrap:wrap;justify-content:center;
  font-family:var(--serif);line-height:1.2;
}
.l1{
  font-size:clamp(1.4rem,5.5vw,2.8rem);
  font-weight:300;letter-spacing:.18em;
  color:var(--blossom);text-transform:uppercase;
}
.l2{
  font-size:clamp(2.4rem,10vw,5rem);
  font-weight:600;font-style:italic;
  color:var(--cream);
  text-shadow:0 0 40px rgba(232,84,122,.5);
}
.slot{display:inline-block;opacity:0;min-width:.05em}
.slot.sp{min-width:.35em}
.slot.ok{opacity:1;animation:reveal .5s cubic-bezier(.2,1.4,.3,1)}
@keyframes reveal{
  0%{transform:translateY(-12px) scale(1.5);filter:brightness(3) blur(4px)}
  100%{transform:none;filter:none}
}

/* chữ bay */
.fly{
  position:fixed;left:0;top:0;z-index:8;
  pointer-events:none;
  font-family:var(--serif);font-weight:600;
  will-change:transform;
}

/* hint */
#hint{
  font-family:var(--serif);font-style:italic;
  font-size:1.1rem;color:var(--blossom);
  opacity:.85;text-align:center;padding:0 1.5rem;
  animation:breathe 2.4s ease-in-out infinite;
  letter-spacing:.06em;
}
@keyframes breathe{50%{opacity:.35}}

/* nút */
#btn{
  margin-top:.3rem;
  padding:.72rem 2.2rem;
  border:1px solid rgba(232,84,122,.55);
  border-radius:4px;
  background:transparent;
  color:var(--blossom);
  font:600 .92rem var(--sans);
  letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;
  transition:background .3s,color .3s,box-shadow .3s;
}
#btn:hover{
  background:rgba(232,84,122,.18);
  color:var(--cream);
  box-shadow:0 0 24px rgba(232,84,122,.3);
}

/* ── CARD ── */
#card{
  position:fixed;inset:0;z-index:20;
  display:flex;align-items:center;justify-content:center;
  padding:clamp(.6rem,3vw,1.4rem);
  opacity:0;pointer-events:none;
  transition:opacity 1.4s;
  overflow-y:auto;
}
#card.show{opacity:1;pointer-events:auto}

.box{
  position:relative;
  width:100%;max-width:460px;
  margin:auto;
  padding:clamp(1.4rem,5vw,2.4rem) clamp(1rem,4vw,2rem) clamp(1rem,4vw,1.6rem);
  border-radius:2px;
  background:linear-gradient(155deg,rgba(30,8,22,.9),rgba(14,6,16,.95));
  border:1px solid rgba(232,84,122,.28);
  box-shadow:
    0 2px 0 rgba(232,84,122,.5),
    0 -2px 0 rgba(232,84,122,.2),
    0 40px 120px rgba(0,0,0,.7),
    inset 0 0 60px rgba(232,84,122,.04);
  text-align:center;
  transform:translateY(40px) scale(.93);
  transition:transform 1.4s cubic-bezier(.15,1.2,.3,1);
}
#card.show .box{transform:none}

/* top accent line */
.box::before{
  content:'';position:absolute;top:8px;left:8px;right:8px;
  height:1px;background:linear-gradient(90deg,transparent,rgba(232,84,122,.6),transparent);
}
.box::after{
  content:'';position:absolute;bottom:8px;left:8px;right:8px;
  height:1px;background:linear-gradient(90deg,transparent,rgba(232,84,122,.4),transparent);
}

.date-badge{
  font-family:var(--serif);font-weight:300;
  font-size:.72rem;letter-spacing:.3em;
  color:var(--gold);text-transform:uppercase;
  margin-bottom:.8rem;opacity:.9;
}

.petal-row{
  display:flex;justify-content:center;gap:.4rem;
  margin:.2rem 0 .5rem;font-size:1.3rem;
  animation:drift 4s ease-in-out infinite;
}
@keyframes drift{50%{transform:translateY(-4px)}}

.to-line{
  font-family:var(--serif);font-style:italic;
  font-size:.95rem;color:var(--blossom);
  letter-spacing:.06em;margin:0;opacity:.8;
}
.name{
  font-family:var(--serif);font-weight:600;
  font-size:clamp(1.9rem,7vw,2.8rem);
  color:var(--cream);
  letter-spacing:.04em;
  background:linear-gradient(110deg,var(--blossom),var(--cream) 40%,var(--gold) 70%,var(--blossom));
  background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 6s linear infinite;
  margin:.15rem 0 0;line-height:1.1;
}
@keyframes shine{to{background-position:-200% 0}}

/* divider */
.orn{
  display:flex;align-items:center;gap:.8rem;
  margin:1rem 0;color:rgba(232,84,122,.5);
}
.orn span{font-size:.65rem;letter-spacing:.3em;color:var(--petal);opacity:.7}
.orn::before,.orn::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(232,84,122,.4));
}
.orn::after{transform:scaleX(-1)}

#msg{
  font-family:var(--serif);font-style:italic;
  font-size:clamp(.88rem,2.5vw,1.05rem);
  line-height:1.85;font-weight:300;
  color:rgba(255,246,240,.85);
  min-height:5.5em;text-align:center;
  margin:0 .2rem;
}

/* wishes */
.wishes{
  display:grid;grid-template-columns:1fr 1fr;
  gap:.5rem;margin:.9rem 0 .7rem;
}
.w{
  padding:.6rem .5rem;
  border:1px solid rgba(232,84,122,.18);
  border-radius:2px;
  background:rgba(232,84,122,.05);
  opacity:0;transform:translateY(16px);
  transition:opacity .7s,transform .7s cubic-bezier(.2,1.4,.3,1);
  text-align:left;
}
.w.on{opacity:1;transform:none}
.w i{font-style:normal;font-size:1.1rem;display:block;margin-bottom:.25rem}
.w b{
  display:block;
  font-family:var(--serif);font-weight:600;
  font-size:.82rem;color:var(--blossom);
  margin-bottom:.15rem;letter-spacing:.03em;
}
.w span{font-size:.7rem;font-weight:400;opacity:.7;line-height:1.5;display:block}

/* quote */
.quote{
  font-family:var(--serif);font-style:italic;
  font-size:clamp(.88rem,2.5vw,1rem);
  color:var(--gold);opacity:0;
  line-height:1.7;margin:.6rem .2rem .1rem;
  transition:opacity 1.4s;
}
.sign{
  font-family:var(--serif);font-style:italic;
  font-size:.95rem;color:var(--petal);
  opacity:0;transition:opacity 1.4s;
  margin:.3rem 0;letter-spacing:.04em;
}
.on2{opacity:1}

.btns{
  opacity:0;transition:opacity 1s;
  margin-top:.5rem;
}
.btns small{
  font-family:var(--serif);font-style:italic;
  font-size:.78rem;color:var(--blossom);
  opacity:.6;letter-spacing:.04em;
}

/* ── tim bay ── */
.heart{
  position:fixed;bottom:-60px;z-index:5;pointer-events:none;
  animation:floatUp linear forwards;
  will-change:transform,opacity;
}
@keyframes floatUp{to{transform:translate(var(--dx),-118vh) rotate(var(--rot));opacity:0}}

/* ── burst ── */
.burst{
  position:fixed;z-index:99;pointer-events:none;
  animation:bst .9s ease-out forwards;
}
@keyframes bst{to{transform:translate(var(--bx),var(--by)) scale(.2);opacity:0}}

/* ── cursor custom ── */
*{cursor:none!important}
#cur{
  position:fixed;left:0;top:0;z-index:999;pointer-events:none;
  font-size:22px;opacity:0;transition:opacity .2s;
  color:var(--petal);
  text-shadow:0 0 10px var(--petal),0 0 24px var(--blossom);
  transform-origin:center;
}
#cur span{display:inline-block;animation:beat 1.4s ease-in-out infinite}
@keyframes beat{15%{transform:scale(1.4)}30%{transform:scale(1)}45%{transform:scale(1.25)}}
.trail{
  position:fixed;z-index:998;pointer-events:none;
  transform:translate(-50%,-50%);
  animation:tr 1.1s ease-out forwards;
  color:var(--petal);
}
@keyframes tr{to{transform:translate(calc(-50% + var(--tx)),-80px) scale(.3);opacity:0}}

/* scrollbar */
#card::-webkit-scrollbar{width:3px}
#card::-webkit-scrollbar-track{background:transparent}
#card::-webkit-scrollbar-thumb{background:var(--petal);border-radius:99px}

@media(prefers-reduced-motion:reduce){
  .slot.ok,.nebula,.star,.petal-row,.heart,.burst{animation:none}
}
</style>
</head>
<body>
<div id="sky">
  <div class="nebula n1"></div>
  <div class="nebula n2"></div>
  <div class="nebula n3"></div>
</div>

<div id="stage">
  <div class="line l1" id="l1"></div>
  <div class="line l2" id="l2"></div>
  <p id="hint">— một thông điệp đang lạc giữa các vì sao —</p>
  <button id="btn">Giải mã 💌</button>
</div>

<div id="card">
  <div class="box">
    <div class="date-badge">20 · 10 &nbsp;·&nbsp; Ngày Phụ nữ Việt Nam</div>
    <div class="petal-row">🌸 🌹 🌸</div>
    <p class="to-line">Gửi </p>
    <h1 class="name" id="CHC"></h1>
    <div class="orn"><span>❀</span></div>
    <div id="msg"></div>
    <div class="wishes" id="wishes"></div>
    <div class="quote" id="quote"></div>
    <div class="sign" id="sign"></div>
    <div class="btns" id="btns">
      <small> 💌PINO đẳng sờ cấp💌 </small>
    </div>
  </div>
</div>

<!-- Đặt nhạc MP3 của bạn vào pino.mp3 cùng thư mục với file này. -->
<audio id="bgm" src="pino.mp3" loop preload="none"></audio>

<div id="cur"><span>🌸</span></div>

<script>
const CFG = {
  l1:'CHÚC MỪNG 20/10',
  l2:'Gửi Linh',
  name:'Linh 💖',
  intro:'Nhân ngày 20/10,cả sinh nhật chúc em luôn xinh đẹp, rạng rỡ như đóa hồng đầu mùa. Mong mỗi ngày của bạn đều ngập tràn tiếng cười và thật nhiều yêu thương. 🌸',
  wishes:[
    ['🌸','Luôn xinh đẹp','Rạng rỡ từ nụ cười đến trái tim.'],
    ['💖','Thật hạnh phúc','Mỗi ngày đều có một niềm vui nhỏ.'],
    ['✨','Bình yên','Nhẹ nhàng giữa mọi bộn bề.'],
    ['🌹','Được yêu thương','Nhiều hơn bạn có thể đếm hết.'],
  ],
  quote:'sống khỏe sống tốt sống giai, sống vui sống đẹp sống hạnh phúc 🌸',
  sign:'— 20/10  zui zẻ 🌹',
};
const POOL='ABCDEFGHIKLMNOPQRSTUVXYĂÂÊÔƠƯ0123456789';
const rnd=a=>Array.isArray(a)||typeof a==='string'?a[Math.floor(Math.random()*a.length)]:0;
const R=(a,b)=>Math.random()*(b-a)+a;
const $=id=>document.getElementById(id);

// stars
for(let i=0;i<70;i++){
  const s=document.createElement('div');
  s.className='star';
  const sz=R(.8,2.5);
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${R(0,100)}vw;top:${R(0,100)}vh;--d:${R(2,6)}s;animation-delay:${R(0,5)}s`;
  $('sky').appendChild(s);
}

$('CHC').textContent=CFG.name;
$('sign').textContent=CFG.sign;
$('quote').textContent='"'+CFG.quote+'"';
$('wishes').innerHTML=CFG.wishes.map(w=>`<div class="w"><i>${w[0]}</i><b>${w[1]}</b><span>${w[2]}</span></div>`).join('');

const flyers=[];
let W=innerWidth,H=innerHeight,decoding=false,landed=0,total=0;

function build(el,text,cls){
  [...text].forEach(c=>{
    const s=document.createElement('span');
    s.className='slot'+(c===' '?' sp':'');
    s.textContent=c===' '?'\u00a0':c;
    el.appendChild(s);
    if(c!==' ')flyers.push({slot:s,c,cls,real:true});
  });
}
build($('l1'),CFG.l1,'l1');
build($('l2'),CFG.l2,'l2');
total=flyers.length;

const COLORS=['#f2a0b8','#e8547a','#fff6f0','#e8c06a','#c09ae8'];
function init(){
  flyers.forEach(f=>mk(f,parseFloat(getComputedStyle(f.slot).fontSize)));
  for(let i=0;i<30;i++){
    const f={real:false,c:'',cls:''};
    flyers.push(f);
    mk(f,R(16,48));
  }
  requestAnimationFrame(tick);
}
function mk(f,size){
  const e=document.createElement('div');
  e.className='fly';
  e.style.fontSize=size+'px';
  e.style.opacity=f.real?.9:.4;
  e.style.color=rnd(COLORS);
  e.style.fontFamily="'Cormorant Garamond',serif";
  e.style.fontWeight='600';
  e.textContent=rnd(POOL);
  document.body.appendChild(e);
  Object.assign(f,{el:e,x:R(0,W),y:R(0,H),vx:R(-2.2,2.2),vy:R(-2.2,2.2),rot:R(0,360),vr:R(-3,3),t:R(0,6),sc:1,state:'fly'});
}
function tick(){
  flyers.forEach(f=>{
    if(f.state==='done'||!f.el)return;
    if(f.state==='fly'){
      f.vx+=R(-.1,.1);f.vy+=R(-.1,.1);
      const m=Math.hypot(f.vx,f.vy),mx=2.8;
      if(m>mx){f.vx*=mx/m;f.vy*=mx/m}
      f.x+=f.vx;f.y+=f.vy;f.rot+=f.vr;
      f.t+=.03;f.sc=1+Math.sin(f.t)*.28;
      if(f.x<-20||f.x>W+20)f.vx*=-1;
      if(f.y<-20||f.y>H+20)f.vy*=-1;
      f.x=Math.max(-20,Math.min(W+20,f.x));
      f.y=Math.max(-20,Math.min(H+20,f.y));
    }else{
      const k=.08;
      f.x+=(f.tx-f.x)*k;
      f.y+=(f.ty-f.y)*k;
      f.rot+=(0-f.rot)*k;
      f.sc+=(1-f.sc)*k;
      if(Math.hypot(f.tx-f.x,f.ty-f.y)<1&&Math.abs(f.rot)<.8)land(f);
    }
    f.el.style.transform=`translate(${f.x}px,${f.y}px) translate(-50%,-50%) rotate(${f.rot}deg) scale(${f.sc})`;
  });
  requestAnimationFrame(tick);
}
function land(f){
  f.state='done';f.el.remove();
  f.slot.classList.add('ok');
  sparkle(f.slot);
  if(++landed===total){
    $('hint').textContent='💌 Thông điệp đã về đến nơi';
    heartStorm();
    setTimeout(showCard,1800);
  }
}
setInterval(()=>flyers.forEach(f=>{
  if(f.el&&f.state!=='done'&&Math.random()<.35)f.el.textContent=rnd(POOL);
}),180);

function decode(){
  if(decoding)return;
  decoding=true;
  $('btn').style.display='none';
  $('hint').textContent='các chữ đang tìm về nhau… ✨';
  let i=0;
  flyers.forEach(f=>{
    if(f.real){
      setTimeout(()=>{
        const r=f.slot.getBoundingClientRect();
        f.tx=r.left+r.width/2;
        f.ty=r.top+r.height/2;
        f.rot=((f.rot%360+540)%360)-180;
        f.state='go';f.el.textContent=f.c;
      },500+i++*140);
    }else{
      setTimeout(()=>{if(f.el)f.el.style.opacity=0},R(200,1200));
      setTimeout(()=>{f.state='done';if(f.el)f.el.remove()},2200);
    }
  });
}
$('btn').onclick=decode;
$('stage').addEventListener('click',e=>{if(e.target.id!=='btn')decode()});
addEventListener('resize',()=>{W=innerWidth;H=innerHeight});

(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(init);

function sparkle(el){
  const r=el.getBoundingClientRect();
  const cx=r.left+r.width/2,cy=r.top+r.height/2;
  ['✦','·','✧'].forEach(ch=>burst(cx,cy,ch,10));
}
function burst(x,y,ch,sz){
  const b=document.createElement('div');
  b.className='burst';b.textContent=ch;
  b.style.cssText+=`left:${x}px;top:${y}px;font-size:${sz+R(0,8)}px;color:${rnd(COLORS)};--bx:${R(-60,60)}px;--by:${R(-60,60)}px`;
  document.body.appendChild(b);
  setTimeout(()=>b.remove(),920);
}
const HEARTS=['🌸','🌹','💖','💗','💕','✿','❀','💝'];
function heart(){
  const h=document.createElement('div');
  h.className='heart';h.textContent=rnd(HEARTS);
  const d=R(5,10);
  h.style.cssText+=`left:${R(0,100)}vw;font-size:${R(14,36)}px;animation-duration:${d}s;--dx:${R(-70,70)}px;--rot:${R(-35,35)}deg;opacity:${R(.5,.95)}`;
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),d*1000);
}
function heartStorm(){for(let i=0;i<35;i++)setTimeout(heart,i*65)}

function showCard(){
  $('stage').classList.add('hide');
  $('card').classList.add('show');
  setInterval(heart,300);
  heartStorm();
  let i=0;
  setTimeout(function type(){
    $('msg').textContent=CFG.intro.slice(0,++i);
    if(i<CFG.intro.length)setTimeout(type,38);
    else{
      document.querySelectorAll('.w').forEach((w,k)=>setTimeout(()=>w.classList.add('on'),k*320));
      setTimeout(()=>$('quote').classList.add('on2'),1600);
      setTimeout(()=>$('sign').classList.add('on2'),2400);
      setTimeout(()=>$('btns').style.opacity=1,2900);
    }
  },900);
}
addEventListener('keydown',e=>{
  if(e.code==='Space'){
    e.preventDefault();
    if(!decoding)decode();else heartStorm();
  }
});

// ── audio: phát khi user tương tác lần đầu ──
(function(){
  const bgm=$('bgm');
  let unlocked=false;
  function unlock(){
    if(unlocked||!bgm.src||bgm.src===location.href)return;
    unlocked=true;
    bgm.volume=0;
    bgm.play().then(()=>{
      // fade in 2s
      let v=0;
      const iv=setInterval(()=>{
        v=Math.min(v+.025,.72);
        bgm.volume=v;
        if(v>=.72)clearInterval(iv);
      },50);
    }).catch(()=>{unlocked=false});
    ['click','touchstart','keydown'].forEach(ev=>document.removeEventListener(ev,unlock));
  }
  ['click','touchstart','keydown'].forEach(ev=>document.addEventListener(ev,unlock,{once:false}));
  window._setBGM=function(src){bgm.src=src;unlocked=false};
})();

// cursor
const cur=$('cur');let lt=0;
addEventListener('pointermove',e=>{
  cur.style.transform=`translate(${e.clientX}px,${e.clientY}px) translate(-50%,-50%)`;
  cur.style.opacity=1;
  const n=performance.now();
  if(n-lt<55)return;lt=n;
  const t=document.createElement('div');
  t.className='trail';t.textContent=rnd(['🌸','·','✦','❀']);
  t.style.cssText+=`left:${e.clientX}px;top:${e.clientY}px;font-size:${R(9,18)}px;--tx:${R(-25,25)}px`;
  document.body.appendChild(t);setTimeout(()=>t.remove(),1100);
});
document.addEventListener('mouseleave',()=>cur.style.opacity=0);
$('card').addEventListener('click',e=>{
  if(e.target.tagName!=='BUTTON')for(let i=0;i<5;i++)burst(e.clientX,e.clientY,rnd(HEARTS),16);
});
